<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Browser</title>
  <style>
    body { margin:0; font-family: system-ui; background:#111; color:white; }
    .toolbar { background:#222; padding:10px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:100; }
    input { flex:1; padding:12px; border-radius:999px; border:none; background:#333; color:white; font-size:16px; }
    button { padding:12px 20px; border:none; background:#00bfff; color:white; border-radius:999px; font-weight:bold; cursor:pointer; }
    .content { padding:20px; }
    h1 { text-align:center; margin:20px 0; font-size:24px; }
  </style>
</head>
<body>
  <div class="toolbar">
    <button onclick="Telegram.WebApp.openLink('https://www.google.com')">🏠 Google</button>
    <input id="urlInput" type="text" placeholder="Enter URL or search" value="https://www.google.com">
    <button onclick="goUrl()">Go</button>
  </div>
  
  <h1>🌐 Mini Browser</h1>
  
  <div class="content">
    <h2>🔎 Quick Google Search</h2>
    <input id="searchInput" type="text" placeholder="What do you want to search on Google?" style="width:100%; padding:15px; border-radius:999px; margin-bottom:15px;">
    <button onclick="googleSearch()" style="width:100%; margin-bottom:10px; padding:15px;">🔎 Google Web Search</button>
    <button onclick="googleImageSearch()" style="width:100%; padding:15px;">🖼 Google Image Search</button>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();

    function goUrl() {
      let url = document.getElementById('urlInput').value.trim();
      if (!url) return;
      if (!url.startsWith('http')) url = 'https://' + url;
      Telegram.WebApp.openLink(url, { try_instant_view: true });
    }

    function googleSearch() {
      let q = document.getElementById('searchInput').value.trim();
      if (q) {
        Telegram.WebApp.openLink(`https://www.google.com/search?q=${encodeURIComponent(q)}`, { try_instant_view: true });
      }
    }

    function googleImageSearch() {
      let q = document.getElementById('searchInput').value.trim();
      if (q) {
        Telegram.WebApp.openLink(`https://www.google.com/search?q=${encodeURIComponent(q)}&tbm=isch`, { try_instant_view: true });
      }
    }
  </script>
</body>
</html>
